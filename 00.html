<style>
   [data-pp] [data-elem-type="text"] {
      @media (max-width: 1420px) {
         /* width: 300px !important; */
         width: 95vw !important;
      }
   }


   .audio-player {
      margin-bottom: 20px;
      background-color: #9E230E;
      border-radius: 13px;
      height: 111px;
      color: white;
      width: 100%;
      position: relative;
   }

   .audio-player__audio {
      display: none;
   }

   .audio-player__line {
      position: absolute;
      /* width: 100%; */
      height: 2px;
      background-color: #BCB8B8;
      top: 62px;
      left: 139px;
      right: 28px;

   }

   .audio-player__pointer {
      width: 13px;
      height: 13px;
      background-color: white;
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      border-radius: 50%;
   }

   .audio-player__whiteline {
      width: 0px;
      height: 2px;
      background-color: white;
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
   }

   .audio-player__play,
   .audio-player__pause {
      cursor: pointer;
      user-select: none;
      width: fit-content;
      width: 71px;
      height: 71px;
      background-image: url("https://activepads.com/audio/play.svg");
      background-size: 100%;
      position: absolute;
      left: 34px;
      top: 22px;
   }

   .audio-player__pause {
      background-image: url("https://activepads.com/audio/pause.svg");
   }

   .audio-player__current,
   .audio-player__total {
      position: absolute;
      top: 72px;
      left: 139px;
      font-family: var(--t-text-font, Arial);
      font-size: 12px;
      font-weight: 500;
   }

   .audio-player__total {
      left: inherit;
      right: 28px;
   }
</style>

<script>

   const srcs = [
      "https://activepads.com/audio/В наших умах и сердцах.mp3",
      "https://activepads.com/audio/В последнее время.mp3",
      "https://activepads.com/audio/Я хочу, чтобы там услышали.mp3",
      "https://activepads.com/audio/Если мы храним материальное.mp3",
      "https://activepads.com/audio/Память о павших.mp3",
   ];


   const audioPlayerTemplateHTML = `
         <audio class="audio-player__audio" src="pathToMP3"></audio>

         <div class="audio-player__play"></div>
         <div class="audio-player__pause" style="display:none;"></div>
         <div class="audio-player__current">0:00</div>
         <div class="audio-player__total">0:00</div>

         <div class="audio-player__line">
            <div class="audio-player__whiteline">
            <div class="audio-player__pointer"></div>
         </div>
      `;


   // const players = document.querySelectorAll('.audio-player');
   const players = document.querySelectorAll('[data-pp]');

   function formatTime(time) {
      if (!isFinite(time) || time < 0) {
         return '0:00';
      }

      const minutes = Math.floor(time / 60);
      const seconds = Math.floor(time % 60).toString().padStart(2, '0');
      return `${minutes}:${seconds}`;
   }

   function setPlayState(playBtn, pauseBtn, isPlaying) {
      playBtn.style.display = isPlaying ? 'none' : 'block';
      pauseBtn.style.display = isPlaying ? 'block' : 'none';
   }

   function updateProgress(audio, currentEl, line, pointer, whiteline) {
      currentEl.textContent = formatTime(audio.currentTime);

      if (!audio.duration || !isFinite(audio.duration)) {
         pointer.style.left = '0px';
         return;
      }

      const progress = audio.currentTime / audio.duration;
      const lineWidth = line.clientWidth;
      const pointerWidth = pointer.clientWidth;
      const maxX = lineWidth - pointerWidth;

      pointer.style.left = (progress * maxX) + 'px';
      whiteline.style.width = (progress * maxX) + 'px';
   }

   function pauseOtherPlayers(currentPlayer) {
      players.forEach((player) => {
         if (player === currentPlayer) return;

         const audio = player.querySelector('.audio-player__audio');
         const playBtn = player.querySelector('.audio-player__play');
         const pauseBtn = player.querySelector('.audio-player__pause');

         audio.pause();
         setPlayState(playBtn, pauseBtn, false);
      });
   }

   players.forEach((playerWrapper, idx) => {

      const player = document.createElement('div');
      player.classList.add('audio-player');

      player.innerHTML = audioPlayerTemplateHTML.replace('pathToMP3', srcs[idx]);

      playerWrapper.querySelector('div').prepend(player);

      const audio = player.querySelector('.audio-player__audio');
      const playBtn = player.querySelector('.audio-player__play');
      const pauseBtn = player.querySelector('.audio-player__pause');
      const currentEl = player.querySelector('.audio-player__current');
      const totalEl = player.querySelector('.audio-player__total');
      const line = player.querySelector('.audio-player__line');
      const pointer = player.querySelector('.audio-player__pointer');
      const whiteline = player.querySelector('.audio-player__whiteline');

      audio.addEventListener('loadedmetadata', () => {
         totalEl.textContent = formatTime(audio.duration);
      });

      audio.addEventListener('timeupdate', () => {
         updateProgress(audio, currentEl, line, pointer, whiteline);
      });

      playBtn.addEventListener('click', () => {
         pauseOtherPlayers(player);
         audio.play();
         setPlayState(playBtn, pauseBtn, true);
      });

      pauseBtn.addEventListener('click', () => {
         audio.pause();
         setPlayState(playBtn, pauseBtn, false);
      });

      audio.addEventListener('ended', () => {
         setPlayState(playBtn, pauseBtn, false);
         currentEl.textContent = '0:00';
         pointer.style.left = '0px';
      });
   });
</script>
